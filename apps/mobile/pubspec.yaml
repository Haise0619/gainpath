name: gainpath_mobile
description: GainPath member and fitness coach mobile application.
publish_to: none
resolution: workspace
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  path_provider: ^2.1.5
  google_fonts: ^6.2.1
  syncfusion_flutter_charts: ^34.2.3
  syncfusion_flutter_gauges: ^34.2.3
  gainpath_domain:
    path: ../../packages/gainpath_domain
  gainpath_data:
    path: ../../packages/gainpath_data
  gainpath_pose:
    path: ../../packages/gainpath_pose
  gainpath_ui:
    path: ../../packages/gainpath_ui
  gainpath_identity:
    path: ../../packages/gainpath_identity
  firebase_core: ^4.15.0
  firebase_app_check: 0.4.8
  firebase_auth: ^6.7.0
  firebase_storage: ^13.6.0
  file_selector: ^1.0.4
  http: ^1.6.0
  phone_numbers_parser: 9.0.28
  country_picker: 2.0.28
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  camera: 0.11.4
  tflite_flutter: 0.12.1
  crypto: 3.0.6
  video_player: ^2.10.1
  url_launcher: ^6.3.2
  qr_flutter: 4.1.0

dev_dependencies:
  firebase_auth_platform_interface: ^9.1.0
  firebase_core_platform_interface: ^8.1.1
  camera_platform_interface: ^2.14.0
  flutter_lints: ^3.0.0
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  video_player_platform_interface: ^6.9.0

flutter:
  uses-material-design: true
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
  assets:
    - assets/images/ai_coach_mascot.png
    - assets/fonts/BarlowCondensed-OFL.txt
    - assets/models/pose_detection.tflite
    - assets/models/pose_landmark_full.tflite
    - assets/models/LICENSE.mediapipe
